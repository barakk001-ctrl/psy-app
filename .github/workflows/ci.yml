name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # A throwaway database for the *.db.test.ts suites (isolation, export, closure)
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psy
          POSTGRES_PASSWORD: localtestonly
          POSTGRES_DB: psy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://psy:localtestonly@127.0.0.1:5432/psy_test

      - name: Build
        run: npm run build
